# A .prg for the AC6502: a raw image loaded at $0800 by BASIC's LOAD, whose first
# twelve bytes are the tokenized line `10 SYS 2060` (6502-PRG's layout).
#
# CART and VECTORS are there for the sample cartridges rebuilt to run from RAM
# (cart.inc): the cartridge's code follows the stub, and its vectors land after
# it, where nothing reads them.

MEMORY {
  RAM: start=$0800, size=$7800, file="%O";
}

SEGMENTS {
  CODE:     load=RAM, type=rw;
  CART:     load=RAM, type=rw, optional=yes;
  VECTORS:  load=RAM, type=rw, optional=yes;
  RESULTS:  load=RAM, type=rw, optional=yes, define=yes;
}

# RESULTS is part of the file rather than bss: BASIC puts its variables straight
# after the loaded image, and the loop that reads the results back is BASIC.
