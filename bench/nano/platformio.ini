; Arduino Nano bus harness for the PICO9918 PRO (PLAN.md section 5).
; Build: pio run        Upload: pio run -t upload
; Clones with the old bootloader: pio run -e nanoatmega328 -t upload

[platformio]
default_envs = nanoatmega328new

[env]
platform = atmelavr
framework = arduino
monitor_speed = 1000000
build_flags =
  -Wall -Wextra
  ; The receive ring must hold a whole packet before any of it goes on the bus.
  ; It stays at 256 -- the largest the core's 8-bit ring indices allow -- and
  ; BLOCK_MAX below keeps the largest packet inside it.
  -DSERIAL_RX_BUFFER_SIZE=256
  -DSERIAL_TX_BUFFER_SIZE=64

[env:nanoatmega328new]
board = nanoatmega328new

[env:nanoatmega328]
board = nanoatmega328
